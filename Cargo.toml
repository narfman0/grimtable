[workspace]
resolver = "2"
members = ["crates/engine", "crates/content", "crates/server"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/narfman0/grimtable"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
