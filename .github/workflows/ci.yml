name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GRIMTABLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run -p content -- report
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack build crates/wasm --target web --out-dir ../../client/src/wasm
      - run: ./scripts/sync-data.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run smoke
        working-directory: client
      - run: for f in adeptus-mechanicus adeptus-custodes necrons; do mkdir -p client/public/data/catalogue && cargo run -q -p content -- catalogue $f > client/public/data/catalogue/$f.json; done
      - run: npm run e2e
        working-directory: client
